  # Virtual / VM-hosted code (T3-equivalent of the `virtual` segment).
  # Hot-loaded engine code that gets relocated by VMASM.S at runtime.
  # (Was provisional, now confirmed: see vram below.) The old 0x8013AAF0 collided with `code` once that moved to
  # 0x80200500 (duplicate symbol definitions at 0x8020D5xx), so it had to move.
  #
  # History: before the code confirmed it, delta
  # voting over the 370 `jal` targets in 0x80400000-0x80430B20 favours
  # 0x802B6000 at 45.9% (chance is ~1%), which maps ROM 0x14A000 -> 0x80400000
  # and implies 0x803F15F0 at this segment's start. Runner-up scored 38.6%, so
  # the margin is thin.
  #
  # These modules are TLB-paged by VMASM.S/VMEMORY.C, not statically resident,
  # so a single splat vram cannot be right for all of them anyway — see #23 and
  # #13 (hand them to N64Recomp as relocatable sections).
  # 0x13B5F0-0x14A000 is not this module and not code anything runs: it is a
  # stale copy of an older link of the engine's .text, ROM 0x15F0-0x10000
  # moved by 0x13A000 (68.6% of the words equal, 0x1C-0x20 bytes of drift in
  # 0x13C5F0-0x1405F0). Nothing maps or loads it (docs/SEGMENTS.md, round 21).
  - name: pre_virtual
    type: bin
    start: 0x13B5F0

  - name: virtual
    type: code
    align: 4
    start: 0x14A000
    vram: 0x00400000     # useg, like Turok 3's `virtual`. Confirmed by the code:
                         # VM_Initialize (func_0028D820) makes one page region,
                         # first page 0x400 (vaddr 0x400000), 0x80 pages, source
                         # gVirtualRomStart | 0xB0000000; with the expansion pak it loads
                         # gVirtualModule1Size bytes of ROM 0x14A000 and maps them at 0x400000.
                         # (The jal-delta sweep found the same: 0x2B6000,
                         # 170/364 targets on a prologue.)
