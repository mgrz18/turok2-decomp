name: Turok 2 - Seeds of Evil
sha1: fb0400f21e3f043939ab56500c7b12a3231006f1

options:
  basename: turok2
  base_path: ../us
  target_path: ../baserom.us.z64
  src_path: ../src/us
  asm_path: ../us/asm
  symbol_addrs_path:
    - ../versions/symbol_addrs.us.txt
    - ../versions/symbols_from_scan.us.txt
  undefined_funcs_auto_path: ../versions/undefined_funcs_auto.us.txt
  undefined_syms_auto_path: ../versions/undefined_syms_auto.us.txt

  compiler: SN64
  # Link objects at their exact ROM positions. GAS gives every MIPS object a
  # 16-byte section alignment and splat pads each segment to 16 on top, and
  # together they pushed .code_rodata from 0x800A51F8 to 0x800A5200 -- every
  # %lo into it came out 8 high, and the ROM grew by 124 bytes.
  subalign: 4
  # Asm pulled into C files with INCLUDE_ASM goes through asn64, SN's own
  # assembler, which reads `$29` as a register but not `$sp` -- a bare `$`
  # is its hex prefix. Keep those files numeric.
  named_regs_for_c_funcs: False
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  platform: n64
  find_file_boundaries: True
  use_legacy_include_asm: False
  generated_c_preamble: "#include \"include_asm.h\""
  generated_s_preamble: ".set fp=64"

# ROM layout (see docs/SEGMENTS.md and docs/MICROCODE.md for the full
# investigation). Combines two parallel analyses:
#   - segment refinement based on function-prologue density + opcode
#     shape scans + SN64 LNK record signatures
#   - RSP microcode location via libultra SDK signature strings
#
#   0x0000   - 0x0040   : ROM header
#   0x0040   - 0x1000   : IPL3 / boot
#   0x1000   - 0x1100   : SN64 entry stub (engine .text begins after)
#   0x1100   - 0xA5FD8  : engine .text (game logic + classes)
#   0xA5FD8  - 0xBDF2C  : engine .rodata (type-registry strings, jump tables)
#   0xBDF2C  - 0xC0950  : RSP microcode region (rspboot + aspMain + F3DEX)
#   0xC0950  - 0xC2ED8  : engine .rodata tail
#   0xC2ED8  - 0xC3074  : 3 trailing engine functions (pass 3 prologue scan)
#   0xC3074  - 0xC8A60  : libaudio .text (no COP0 ops; float DSP)
#   0xC8A60  - 0xDEDE0  : libultra OS .text (threads, exceptions, gu math)
#   0xDEDE0  - 0xF6F2C  : libultra .rodata + audio sample tables
#   0xF6F2C  - 0xF7F50  : duplicate ucode copy used by IPL3
#   0xF7F50  - 0x107000 : libultra .sdata/.data tail
#   0x107000 - 0x13B5F0 : SN64 LNK source-debug section (paths, line info)
#   0x13B5F0 - 0x17A600 : virtual_text_0 (VM module 1 .text)
#   0x17A600 - 0x186000 : virtual_rodata_0
#   0x186000 - 0x1B3400 : virtual_text_1 (VM module 2 .text)
#   0x1B3400 - 0x1BFA00 : virtual_rodata_1
#   0x1BFA00 - 0x1DEE00 : virtual_text_2 (VM module 3 .text)
#   0x1DEE00 - 0x20E334 : virtual_rodata_2 / .sdata
#   0x20E334 - 0x20F178 : assets_index (913 x uint32 offset table)
#   0x20F178 - 0x1FF7AEC: compressed assets (textures, audio, levels)
#   0x1FF7AEC- 0x2000000: 0xFF trailer (ROM padding)
segments:
  - name: header
    type: header
    start: 0x0

  - name: boot
    type: bin
    start: 0x40

  - name: main
    type: code
    align: 4
    start: 0x1000
    vram: 0x80000400
    subsegments:
      # SN64 entry stub — wired via hasm so the splat-emitted asm is
      # replaced by the hand-written src/us/asm/boot.s (byte-exact).
      # `base_path` is ../us, hence the ../ prefix.
      - [0x1000, hasm, ../src/us/asm/boot]

  # VRAM corregido en el pass 6. Era 0x80000500, heredado de suponer que el
  # engine se carga contiguo tras el stub de entrada. La evidencia dice que no:
  # de las 15,680 instrucciones `jal` del area de codigo, 14,208 apuntan a
  # 0x802xxxxx y exactamente UNA a 0x800xxxxx. Mapeando esos targets con
  # delta 0x801FF400 (o sea ROM 0x1100 -> VRAM 0x80200500), el 65.6% cae
  # exactamente sobre un prologo `addiu sp,sp,-X`; con el VRAM anterior cae
  # el 0.0%, contra una tasa base de ~1% por azar.
  # El stub SN64 de 0x1000 es el que hace el DMA a este banco.
  - name: code
    type: code
    align: 4
    start: 0x1100
    vram: 0x00200500     # useg: el codigo corre mapeado por TLB
    subsegments:
      - [0x1100, c, code/func_00200500]
